services:
  covercraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: covercraft_app
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
      - PYTHONUNBUFFERED=1
      - COVERCRAFT_TIMEOUT_DOWNLOAD=600
      - COVERCRAFT_TIMEOUT_DEMUCS=1200
      - COVERCRAFT_TIMEOUT_RVC=1200
      - COVERCRAFT_TIMEOUT_FFMPEG=600
    volumes:
      - ./models:/app/models
      - ./assets:/app/assets
      - ./outputs:/app/outputs
      - ./config:/app/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "src/main.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
